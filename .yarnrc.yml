# Use a real node_modules tree. Yarn 4 defaults to Plug'n'Play, which this
# toolchain (vite, esbuild, tsx, drizzle-kit, sharp) does not support cleanly.
nodeLinker: node-modules

# Yarn 4 is provided via the root package.json "packageManager" field and
# Corepack (bundled with Node). Run `corepack enable` once if `yarn` is not
# already on PATH.

# Peer behaviour matching the former pnpm .npmrc:
#   auto-install-peers=false        -> Yarn never auto-installs peers (default)
#   strict-peer-dependencies=false  -> Yarn only warns on peer mismatches (default)

# NOTE: pnpm's `minimumReleaseAge: 1440` supply-chain guard has NO Yarn
# equivalent and is intentionally dropped by this migration. Vet new/updated
# dependencies manually before adding them.
