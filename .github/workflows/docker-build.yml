name: Build & Push Docker Image

on:
  workflow_dispatch:

  # Builds only on release tags (`docker-v*`), not every push to main.
  push:
    tags:
      - 'docker-v*'

concurrency:
  group: docker-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      # ubuntu-latest ships ~14GB free; a full node_modules COPY can fill the disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The SPA's VITE_* build-time config is committed (and non-secret) in
      # artifacts/agri-market/.env.production, so no secrets step is needed here.

      # Single image: Express API + built SPA (see docker-bake.hcl / Dockerfile),
      # pushed to Docker Hub as deidinedocker/l7rith.
      - name: Build & push image
        uses: docker/bake-action@v5
        env:
          TAG: ${{ github.ref_name }}
        with:
          files: ./docker-bake.hcl
          targets: all
          push: true
          set: |
            all.cache-from=type=gha,scope=l7rith
            all.cache-to=type=gha,mode=min,scope=l7rith
