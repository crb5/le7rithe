openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Public policy metadata and authenticated policy consent
  - name: marketplace
    description: Marketplace browsing and listings
  - name: account
    description: Account and saved listings
  - name: messages
    description: Buyer and seller messages
  - name: support
    description: Direct support contact
  - name: dashboard
    description: Marketplace metrics
paths:
  /listing-image/uploads/process:
    post:
      operationId: processListingImageUpload
      tags: [marketplace]
      summary: Validate and create full and thumbnail WebP variants of an owned new upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingImageProcessingInput"
      responses:
        "200":
          description: Processed image paths and dimensions
          content:
            application/json:
              schema:
                type: object
                required: [objectPath, originalBytes, fullBytes, thumbnailBytes, width, height]
                properties:
                  objectPath:
                    type: string
                  originalBytes:
                    type: integer
                  fullBytes:
                    type: integer
                  thumbnailBytes:
                    type: integer
                  width:
                    type: integer
                  height:
                    type: integer
        "400":
          description: Invalid, oversized, corrupt, or unowned image
        "401":
          description: Sign-in required
        "403":
          description: Account cannot upload
        "503":
          description: Image storage or processing temporarily unavailable
  /admin/banners/uploads/request-url:
    post:
      operationId: requestBannerImageUpload
      tags: [dashboard]
      summary: Request a private upload URL for a banner image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerImageUploadInput"
      responses:
        "200":
          description: Private upload URL and temporary object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerImageUploadUrl"
        "400":
          description: Invalid image metadata
        "401":
          description: Administrator password required
        "404":
          description: Administrator access denied
        "503":
          description: Image storage temporarily unavailable
  /admin/banners/uploads/process:
    post:
      operationId: processAdminBannerImageUpload
      tags: [dashboard]
      summary: Validate and convert a banner upload to a private WebP image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerImageProcessingInput"
      responses:
        "200":
          description: Processed private WebP image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerImageProcessingResult"
        "400":
          description: Invalid, corrupt, unsupported, or oversized image
        "401":
          description: Administrator password required
        "404":
          description: Administrator access denied
        "503":
          description: Image storage or processing temporarily unavailable
  /banners:
    get:
      operationId: listBanners
      tags: [marketplace]
      summary: List currently visible homepage banners
      responses:
        "200":
          description: Visible banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal-policy:
    get:
      operationId: getLegalPolicy
      tags: [legal]
      summary: Get current public policy versions and localized last-updated labels
      responses:
        "200":
          description: Current public legal policy metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalPolicy"
  /legal-policy/consent:
    get:
      operationId: getMyLegalConsent
      tags: [legal]
      summary: Get whether the authenticated user accepted the current policy versions
      responses:
        "200":
          description: Current policy consent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalConsentStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: recordLegalConsent
      tags: [legal]
      summary: Record the authenticated user's acceptance of current policy versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalConsentInput"
      responses:
        "200":
          description: Existing or newly recorded acceptance for the current versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalConsentRecord"
        "400":
          description: Invalid request body
        "401":
          description: Authentication required
  /categories:
    get:
      operationId: listCategories
      tags: [marketplace]
      summary: List marketplace categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /categories/{slug}/subcategories:
    get:
      operationId: listSubcategories
      tags: [marketplace]
      summary: List subcategories for a category
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [dashboard]
      summary: List categories for administration
      responses:
        "200":
          description: Admin category catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      tags: [dashboard]
      summary: Create a marketplace category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [dashboard]
      summary: Update a marketplace category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      tags: [dashboard]
      summary: Delete a marketplace category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /admin/categories/{id}/subcategories:
    post:
      operationId: createSubcategory
      tags: [dashboard]
      summary: Create a subcategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcategoryInput" }
      responses:
        "201":
          description: Created subcategory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
  /admin/subcategories/{id}:
    patch:
      operationId: updateSubcategory
      tags: [dashboard]
      summary: Update a subcategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubcategoryUpdate" }
      responses:
        "200":
          description: Updated subcategory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
    delete:
      operationId: deleteSubcategory
      tags: [dashboard]
      summary: Delete a subcategory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /regions:
    get:
      operationId: listRegions
      tags: [marketplace]
      summary: List marketplace regions
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
  /admin/regions:
    get:
      operationId: listAdminRegions
      tags: [dashboard]
      summary: List regions for administration
      responses:
        "200":
          description: Admin region catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
    post:
      operationId: createRegion
      tags: [dashboard]
      summary: Create a marketplace region
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegionInput" }
      responses:
        "201":
          description: Created region
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Region" }
  /admin/regions/{id}:
    patch:
      operationId: updateRegion
      tags: [dashboard]
      summary: Update a marketplace region
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegionUpdate" }
      responses:
        "200":
          description: Updated region
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Region" }
    delete:
      operationId: deleteRegion
      tags: [dashboard]
      summary: Delete a marketplace region
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /locations:
    get:
      operationId: listLocations
      tags: [marketplace]
      summary: List marketplace locations
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
  /market-pulse:
    get:
      operationId: getMarketPulse
      tags: [marketplace]
      summary: Get current marketplace activity
      responses:
        "200":
          description: Marketplace activity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPulse"
  /listings:
    get:
      operationId: listListings
      tags: [marketplace]
      summary: Search and filter listings
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Subcategory"
        - $ref: "#/components/parameters/Location"
        - $ref: "#/components/parameters/SaleType"
        - $ref: "#/components/parameters/Reference"
        - $ref: "#/components/parameters/Brand"
        - $ref: "#/components/parameters/ProductType"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/Condition"
        - $ref: "#/components/parameters/Manufacturer"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Listing search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingSearchResult"
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get listing details
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Listing not found
    patch:
      operationId: updateListing
      tags: [marketplace]
      summary: Update a listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [marketplace]
      summary: Delete a listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204":
          description: Deleted
  /listings/{id}/sold:
    post:
      operationId: markListingSold
      tags: [marketplace]
      summary: Mark a seller-owned listing as sold
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing marked as sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "409":
          description: Listing cannot be marked as sold
  /listings/{id}/revert-sale:
    post:
      operationId: revertListingSale
      tags: [marketplace]
      summary: Revert a recent sale within the five-minute window
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing sale reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "409":
          description: Sale reversal window has expired
  /listings/{id}/lease:
    post:
      operationId: markListingLeased
      tags: [marketplace]
      summary: Mark an owner-controlled rental listing as leased
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Rental listing marked as leased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "409":
          description: Listing is not an available rental
  /listings/{id}/renew:
    post:
      operationId: renewRentalListing
      tags: [marketplace]
      summary: Renew an archived rental listing while the season is open
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Rental listing renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "409":
          description: Rental season is closed or listing cannot be renewed
  /listings/{id}/favorite:
    post:
      operationId: setListingFavorite
      tags: [account]
      summary: Set a listing's saved state
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteState"
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteState"
  /sellers/{id}:
    get:
      operationId: getSellerProfile
      tags: [marketplace]
      summary: Get a seller's public profile summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seller profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
        "404":
          description: Seller not found
  /saved-listings:
    get:
      operationId: listSavedListings
      tags: [account]
      summary: List saved listings
      responses:
        "200":
          description: Saved listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List account messages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to a seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{id}/read:
    patch:
      operationId: markMessageRead
      tags: [messages]
      summary: Mark a received message as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Message marked as read
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /support:
    get:
      operationId: getSupportSettings
      tags: [support]
      summary: Get support contact settings
      responses:
        "200":
          description: Support contact settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSettings"
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a direct support message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Support message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
  /reports:
    get:
      operationId: listReports
      tags: [support]
      summary: List the current user's reports and support requests
      responses:
        "200":
          description: User reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }
    post:
      operationId: createReport
      tags: [support]
      summary: Report a listing or user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
  /reports/{id}:
    get:
      operationId: getReport
      tags: [support]
      summary: Get a report belonging to the current user
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetails" }
  /reports/{id}/read:
    patch:
      operationId: markReportRead
      tags: [support]
      summary: Mark report replies as read
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204": { description: Marked as read }
  /account/me:
    get:
      operationId: getMyAccountProfile
      tags: [account]
      summary: Get the current user's marketplace profile, display name, and verified phone
      responses:
        "200":
          description: Current user's marketplace profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateMyAccountProfile
      tags: [account]
      summary: Update the current user's marketplace display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyAccountProfileUpdate"
      responses:
        "200":
          description: Updated current user's marketplace profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountProfile"
        "400":
          description: Invalid display name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteMyAccount
      tags: [account]
      summary: Permanently delete the current user's account and personal marketplace data
      description: Removes the identity-provider identity, personal marketplace data, listings and photos. Pending payment requests are cancelled; anonymized payment records and legal-consent version and time are retained.
      responses:
        "204":
          description: Account and personal data deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deletion could not be completed; the request can be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/me/email/sync:
    post:
      operationId: syncMyAccountEmail
      tags: [account]
      summary: Sync the current user's verified primary email to the marketplace profile
      responses:
        "200":
          description: Verified email status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountEmail"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email status could not be synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get marketplace dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/active-listings:
    get:
      operationId: listSellerActiveListings
      tags: [dashboard]
      summary: List the current seller's active listings
      responses:
        "200":
          description: Active listings owned by the current seller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
components:
  parameters:
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: q
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    Subcategory:
      name: subcategory
      in: query
      schema:
        type: string
    SaleType:
      name: saleType
      in: query
      schema:
        type: string
    Reference:
      name: reference
      in: query
      schema:
        type: string
    Brand:
      name: brand
      in: query
      schema:
        type: string
    ProductType:
      name: productType
      in: query
      schema:
        type: string
    Location:
      name: location
      in: query
      schema:
        type: string
    MinPrice:
      name: minPrice
      in: query
      schema:
        type: number
    MaxPrice:
      name: maxPrice
      in: query
      schema:
        type: number
    Condition:
      name: condition
      in: query
      schema:
        type: string
        enum: [new, used]
    Manufacturer:
      name: manufacturer
      in: query
      schema:
        type: string
    Model:
      name: model
      in: query
      schema:
        type: string
    Year:
      name: year
      in: query
      schema:
        type: integer
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [newest, price_asc, price_desc]
        default: newest
    Featured:
      name: featured
      in: query
      schema:
        type: boolean
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
  schemas:
    ListingImageProcessingInput:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
    LegalPolicy:
      type: object
      required: [termsVersion, privacyVersion, lastUpdated]
      properties:
        termsVersion: { type: string }
        privacyVersion: { type: string }
        lastUpdated:
          type: object
          required: [ar, fr, en]
          properties:
            ar: { type: string }
            fr: { type: string }
            en: { type: string }
