# Self-hosted stack for Le7rithe: the app (API + SPA in one image), its own
# Postgres, and Authentik (OIDC identity provider) with its Postgres + Redis.
#
# First run:
#   1. Set the variables below (a .env next to this file works), especially
#      AUTHENTIK_SECRET_KEY (openssl rand -base64 48), PG passwords, SESSION_SECRET.
#   2. docker compose up -d
#   3. Open http://localhost:9000/if/flow/initial-setup/ to create the Authentik
#      admin.
#   4. Run ./scripts/setup-authentik.sh (requires `docker compose` on PATH; run
#      it from this directory). It applies authentik-blueprints/le7rithe-setup.yaml,
#      which creates the OAuth2/OIDC Provider + Application (slug: agri-market,
#      with the Authorization flow correctly set to implicit consent from the
#      start — using explicit consent there silently shows Authentik's own
#      hosted consent screen after every custom login/signup, defeating the
#      whole point of the custom auth pages; found the hard way on the first
#      deployment, so it's baked into the blueprint now) and the username/
#      password Enrollment flow the /sign-up page drives. It's idempotent —
#      safe to re-run any time, including on an already-configured server.
#   5. Add a Google social source + an email/OTP stage yourself if desired
#      (not part of the blueprint — needs your own Google OAuth credentials).
#   6. Put the provider's Client ID (shown by the setup script, or in the
#      admin UI) into OIDC_CLIENT_ID / VITE_OIDC_CLIENT_ID and re-up the app.
#   7. The app's own /sign-in and /sign-up pages (agri-market/src/pages,
#      lib/oidc-flow.ts) drive Authentik's flows through its Flow Executor API
#      so Authentik's hosted UI is never shown for username/password login or
#      registration. They assume the default flow slugs
#      "default-authentication-flow" / "default-enrollment-flow" — override
#      via VITE_OIDC_LOGIN_FLOW_SLUG / VITE_OIDC_ENROLLMENT_FLOW_SLUG if you
#      rename them. A stage they don't recognize (e.g. an OTP/MFA stage you
#      enabled) falls back to Authentik's hosted page rather than getting
#      stuck. The "Continue with Google" button's URL is read live off the
#      flow's identification challenge (its `sources` field), not guessed
#      from a slug.

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
  AUTHENTIK_REDIS__HOST: authentik-redis
  AUTHENTIK_POSTGRESQL__HOST: authentik-db
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:?set AUTHENTIK_PG_PASS}
  # Scopes the Authentik session cookie to the whole le7rithe.com domain
  # (covers le7rithe.com and auth.le7rithe.com both). Needed so a session
  # established through the app's custom login/register pages (proxied
  # same-origin at /authentik-api, see Caddyfile) is also seen when the app
  # then redirects to auth.le7rithe.com/application/o/authorize/ to complete
  # the OIDC code+PKCE exchange — that request then completes silently
  # (no Authentik page shown) because the session already exists.
  AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:-le7rithe.com}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - authentik-server

  app:
    build: .
    image: deidinedocker/l7rith:latest
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:${APP_PG_PASS:?set APP_PG_PASS}@app-db:5432/pg4amfin
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-azibmdy@gmail.com}
      OBJECT_STORAGE_DIR: /data/objects
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/agri-market/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Optional: seller WhatsApp notifications (listing approved/rejected, new
      # buyer message, payment confirmed). Leave unset to disable — sends are
      # skipped silently, nothing else depends on these being set.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    volumes:
      - app-objects:/data/objects
    # No public port: Caddy is the only ingress and reaches it as app:3000.

  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_PG_PASS:?set APP_PG_PASS}
      POSTGRES_DB: pg4amfin
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pg4amfin"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?set AUTHENTIK_PG_PASS}
      POSTGRES_DB: authentik
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis-data:/data

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment: *authentik-env
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    # No public port: Caddy fronts it as auth.le7rithe.com → authentik-server:9000.
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment: *authentik-env
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    volumes:
      - ./authentik-blueprints:/blueprints/custom:ro

volumes:
  app-objects:
  app-db-data:
  authentik-db-data:
  authentik-redis-data:
  caddy-data:
  caddy-config:
